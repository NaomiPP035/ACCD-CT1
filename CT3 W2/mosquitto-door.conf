# 仅本机访问 / Local connections only.
# Python 桥接使用 TCP 1884 / Python bridge uses TCP port 1884.
listener 1884 127.0.0.1
protocol mqtt

# 网页使用 WebSocket 9001 / Browser uses WebSocket port 9001.
listener 9001 127.0.0.1
protocol websockets

# 本机演示允许免登录；不要将监听地址改为公网地址。
# Login-free local demo; do not expose these listeners publicly.
allow_anonymous true

# 不保存会话数据到磁盘 / Do not persist session data to disk.
persistence false
